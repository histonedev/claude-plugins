name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CLAUDE_CODE_VERSION: 2.1.308

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - run: scripts/check.sh
